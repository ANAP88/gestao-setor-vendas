# Configuração de deploy seguro para Netlify

[build]
  command = "echo 'Static site - no build needed'"
  publish = "."

# Proteção contra índice de diretório
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Bloquear acesso a arquivos sensíveis
[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.map"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.well-known/security.txt"
  to = "/404.html"
  status = 404
  force = true

# Headers de segurança globais
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Sem caching pra HTML (sempre valida)
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Sem caching pro JS do app (app.js/config.js não têm hash no nome — o projeto é sem build step
# de propósito — então "cache agressivo" faz o navegador nunca buscar a versão nova depois de um
# deploy, a não ser que a pessoa limpe o cache manualmente. Já causou confusão real de "publiquei
# mas não mudou nada". HTML já era assim; JS tinha ficado de fora por engano.)
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Cache agressivo só pra imagens de fato estáticas (logos, etc. — mudam de nome quando trocam)
[[headers]]
  for = "*.{png,jpg,jpeg,gif,svg,webp,woff,woff2}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
