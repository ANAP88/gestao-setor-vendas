<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão Setor de Secretaria de Vendas - Neo Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --bg2:#e9edf3;
  --panel:#ffffff; --panel2:#f6f8fb; --panel3:#eef1f6;
  --text:#101828; --muted:#5b6472; --muted2:#8a93a1;
  --accent:#1657d6; --accent2:#0e3fa3; --accent-soft:#eaf0fd;
  --ok:#0f8a5f; --ok-soft:#e5f6ee;
  --warn:#b5750a; --warn-soft:#fdf1de;
  --err:#c1352b; --err-soft:#fbeaea;
  --border:#dfe3ea; --radius:10px;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text); min-height:100vh; letter-spacing:.1px;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

header{
  display:flex; align-items:center; gap:18px; padding:14px 28px;
  background:var(--panel);
  border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;
}
header h1{
  font-size:16px; font-weight:800; letter-spacing:.2px; color:var(--text);
  display:flex; align-items:center; gap:9px;
}
header h1 .logo{
  width:30px;height:30px;border-radius:8px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
header .spacer{flex:1}

nav{display:flex;gap:3px;flex-wrap:wrap;background:var(--panel2);padding:4px;border-radius:9px;border:1px solid var(--border)}
button.nav{
  background:transparent;color:var(--muted);border:0;border-radius:7px;
  padding:8px 14px;font-size:13px;font-weight:600;
}
button.nav.active{background:var(--accent);color:#fff}
button.nav:not(.active):hover{background:var(--panel3);color:var(--text)}

button{
  background:var(--accent); color:#fff; border:0; border-radius:8px;
  padding:9px 16px; font-weight:600; cursor:pointer; font-size:13px;
  transition:filter .12s, transform .05s;
}
button:hover{filter:brightness(1.1)}
button:active{transform:translateY(1px)}
button.ghost{background:var(--panel); color:var(--text); border:1px solid var(--border)}
button.ghost:hover{background:var(--panel3)}
button:disabled{opacity:.5;cursor:not-allowed}

main{padding:26px 28px;max-width:1360px;margin:0 auto;min-width:0;overflow-x:hidden}

.card{
  background:var(--panel);
  border:1px solid var(--border); border-radius:var(--radius);
  padding:20px; margin-bottom:18px; box-shadow:var(--shadow);
}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}

label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;font-weight:700;letter-spacing:.5px}
input,select{
  background:var(--bg2); border:1px solid var(--border); color:var(--text);
  border-radius:9px; padding:9px 12px; font-size:13px; min-width:150px;
  font-family:inherit; transition:border-color .12s;
}
input:focus,select:focus{outline:none;border-color:var(--accent)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{
  color:var(--muted); text-align:left; padding:10px 12px; font-size:10.5px;
  text-transform:uppercase; letter-spacing:.5px; font-weight:700;
  border-bottom:1px solid var(--border);
}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;
  overflow-wrap:break-word;word-break:normal;hyphens:none}
/* nada que é rótulo/ação pode quebrar no meio da palavra */
td .tag,th .tag,td button,th button,td .hbar-lbl{white-space:nowrap}
td:has(> button){white-space:nowrap}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table-scroll table{min-width:max-content}
tr:hover td{background:var(--panel2)}

.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.2px}
.tag.CONCLUIDO{background:var(--ok-soft);color:var(--ok)}
.tag.PENDENTE{background:var(--warn-soft);color:var(--warn)}
.tag.RECEBIDO,.tag.EM_ANALISE{background:var(--accent-soft);color:var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.inicio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.inicio-card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:var(--panel);
  border:1px solid var(--border); border-radius:var(--radius); padding:22px 14px;
  color:var(--text); font-size:13.5px; font-weight:500; text-align:center; cursor:pointer;
  box-shadow:var(--shadow); transition:transform .12s, border-color .12s;
}
.inicio-card:hover{transform:translateY(-2px); border-color:var(--accent)}
.kpi{
  background:var(--panel);
  border:1px solid var(--border); border-radius:var(--radius); padding:18px;
  box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.5px}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.4px;margin-top:4px}

body:has(#login-page){overflow-x:hidden}
#login-page{
  height:100vh; display:grid; grid-template-columns:1.15fr 1fr;
  background:var(--bg); position:relative; overflow-y:auto;
}
.login-hero{
  position:relative; padding:60px 56px; display:flex; flex-direction:column; justify-content:center;
  background:linear-gradient(160deg, #0d3d3d 0%, #1d7a76 100%);
  border-right:1px solid var(--border);
}
.login-hero, .login-hero h1, .login-hero .hf b{color:#fff}
.hero-badge{
  display:inline-flex; align-items:center; gap:6px; width:fit-content;
  background:rgba(255,255,255,.1); color:#cfe0ff; border:1px solid rgba(255,255,255,.25);
  font-size:11px; font-weight:700; letter-spacing:.4px; padding:6px 12px; border-radius:6px; margin-bottom:22px;
}
.hero-badge-ic{display:flex;width:13px;height:13px}
.hero-badge-ic svg{width:100%;height:100%}
.footer-ic{display:inline-flex;width:12px;height:12px;vertical-align:-1px;margin-right:5px}
.footer-ic svg{width:100%;height:100%}
.login-hero h1{font-size:34px;font-weight:800;line-height:1.25;letter-spacing:-.5px;margin-bottom:14px}
.login-hero h1 span{color:#6be0d3}
.hero-sub{color:#b7c9ec;font-size:14.5px;max-width:440px;margin-bottom:36px}
.hero-features{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px;max-width:560px}
.hf{display:flex;gap:12px;align-items:flex-start}
.hf-ic{
  width:36px;height:36px;flex-shrink:0;border-radius:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;color:#cfe0ff;
}
.hf-ic svg{width:17px;height:17px}
.hf b{font-size:13.5px;display:block;margin-bottom:2px}
.hf small{color:#a9bde3;font-size:12px;line-height:1.4;display:block}
.login-panel{display:flex;align-items:center;justify-content:center;padding:40px}
#login-card{width:100%;max-width:400px;text-align:left;box-shadow:0 12px 32px -14px rgba(16,24,40,.18)}
.login-icon{
  width:52px;height:52px;border-radius:12px;margin-bottom:16px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.login-icon svg{width:24px;height:24px}
#login-card h2{font-size:20px;font-weight:800;margin-bottom:2px}
.login-brandline{color:var(--accent);font-weight:700;font-size:13.5px;margin-bottom:2px}
#login-card .sub{color:var(--muted);font-size:12.5px;margin-bottom:20px}
.input-ic{position:relative;margin-bottom:14px}
.input-ic span{position:absolute;left:12px;top:50%;transform:translate(0,-50%);opacity:.6;display:flex}
.input-ic span svg{width:15px;height:15px}
.input-ic input{width:100%;padding-left:36px}
.login-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;margin-bottom:16px;flex-wrap:wrap;gap:6px}
.chk-inline{display:flex;align-items:center;gap:6px;color:var(--muted);text-transform:none;font-size:12px;font-weight:500}
.chk-inline input{width:auto;accent-color:var(--accent2)}
.login-row a{color:var(--accent);text-decoration:none;font-weight:600}
.login-row a:hover{text-decoration:underline}
#login-card > button{width:100%}
.login-divider{display:flex;align-items:center;gap:10px;color:var(--muted2);font-size:11px;margin:14px 0}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.login-footer-note{margin-top:16px;text-align:center;font-size:11px;color:var(--muted2)}
.login-copyright{
  position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--muted2);
}
@media (max-width:900px){
  #login-page{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto;min-height:100vh}
  .login-hero{padding:36px 24px;border-right:0;border-bottom:1px solid var(--border)}
  .login-hero h1{font-size:26px}
  .hero-features{grid-template-columns:1fr}
  .login-panel{padding:28px 20px 50px}
  .login-copyright{position:static;margin-top:0;padding-bottom:20px}
}

.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{
  background:var(--panel);
  border:1px solid var(--border); border-radius:12px; padding:24px;
  width:660px; max-width:95vw; max-height:90vh; overflow:auto;
  box-shadow:0 16px 40px -14px rgba(16,24,40,.25);
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 input,.grid2 select{width:100%}
.msg{font-size:13px;margin-top:10px;color:var(--warn);font-weight:500}
.pag{display:flex;gap:10px;align-items:center;justify-content:end;margin-top:14px;font-size:12.5px;color:var(--muted)}
h2{font-size:15px;font-weight:700;margin-bottom:14px;letter-spacing:.1px}
.hidden{display:none}

.chart{display:flex;gap:10px;align-items:end;height:200px;padding-top:10px;overflow-x:auto;min-width:0}
.bar-wrap{flex:1 1 0;min-width:34px;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:6px}
.bar-lbl{font-size:11px;white-space:nowrap}
.bar{width:100%;max-width:44px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.bar-lbl{font-size:10.5px;color:var(--muted);font-weight:600}
.bar-val{font-size:11.5px;color:var(--text);font-weight:700}

table.escala th,table.escala td{padding:6px;text-align:center;font-size:12px}
table.escala td:first-child,table.escala th:first-child{text-align:left;white-space:nowrap;font-weight:600}
.esc-cell{cursor:pointer;user-select:none;border-radius:6px}
.esc-cell.on{background:var(--ok-soft);color:var(--ok);font-weight:800}
.esc-cell:hover{outline:1.5px solid var(--accent)}
.wend{background:var(--panel2)}

.alert-box{background:var(--err-soft);border:1px solid var(--err);color:#ffc2cc;border-radius:12px;padding:14px 16px;font-size:14px;font-weight:500}
.ok-box{background:var(--ok-soft);border:1px solid var(--ok);color:#c6fce6;border-radius:12px;padding:14px 16px;font-size:14px;font-weight:500}
.fup{background:var(--panel3);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.chk{display:flex;align-items:center;gap:10px;padding:6px 2px;font-size:13px}
.chk input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent2)}
.chk button{padding:3px 9px;margin-left:auto}

.admin-tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:11px;border:1px solid var(--border);width:fit-content;margin-bottom:18px}
.admin-tab{background:transparent;color:var(--muted);border:0;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600}
.admin-tab.active{background:var(--accent2);color:#fff}
.admin-tab:not(.active):hover{background:var(--panel3);color:var(--text)}
.admin-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.invite-box{
  display:flex; gap:14px; flex-wrap:wrap; align-items:end;
  background:var(--bg2); border:1px solid var(--border); border-radius:12px;
  padding:16px; margin-bottom:18px;
}
.invite-box input, .invite-box select{min-width:220px}
.users-table td{vertical-align:middle}
.row-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch;padding:2px 0}
.row-actions button{font-size:12px;padding:5px 10px;text-align:left;white-space:nowrap}
.row-actions button.danger{color:var(--err);border-color:var(--err)}
.row-actions button.danger:hover{background:var(--err-soft)}

/* Portal do Cliente */
.portal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.portal-card{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:18px 20px;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .15s ease, border-color .15s ease;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.portal-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.portal-card b{font-size:14.5px;line-height:1.3}
.portal-card .arrow{color:var(--muted2);font-size:16px;flex-shrink:0;transition:transform .15s ease}
.portal-card:hover .arrow{transform:translateX(3px);color:var(--accent)}
.portal-proc-card{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:16px 20px;margin-bottom:12px;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.portal-proc-card b{font-size:14px}
.portal-proc-meta{color:var(--muted);font-size:12.5px;margin-top:3px}

.stepper{display:flex;flex-direction:column}
.step-row{display:flex;gap:16px;position:relative;padding-bottom:26px}
.step-row:last-child{padding-bottom:0}
.step-line{position:absolute;left:13px;top:28px;bottom:-26px;width:2px;background:var(--border)}
.step-row:last-child .step-line{display:none}
.step-row.done .step-line{background:var(--ok)}
.step-dot{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;z-index:1;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  background:var(--panel2);color:var(--muted2);border:1.5px solid var(--border);
}
.step-row.done .step-dot{background:var(--ok);color:#fff;border-color:var(--ok)}
.step-row.current .step-dot{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.step-body{padding-top:2px}
.step-body b{font-size:13.5px}
.step-row.pending .step-body b{color:var(--muted)}
.step-meta{color:var(--muted);font-size:12px;margin-top:2px;display:flex;gap:14px;flex-wrap:wrap}
.user-cell{display:flex;align-items:center;gap:10px}
.user-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;
}
.count-badge{
  display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;
  background:var(--panel3);color:var(--muted);border-radius:99px;font-size:11px;font-weight:700;margin-left:4px;
}
.grid-cad{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.cad-list{max-height:320px;overflow:auto;margin-top:2px}
.cad-item{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--border);font-size:13px}
.cad-item button{margin-left:auto;padding:3px 10px}

.layout{display:flex;min-height:100vh;align-items:stretch;max-width:100vw;overflow-x:hidden}
aside{
  width:238px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;
  background:linear-gradient(160deg, #0d3d3d 0%, #1d7a76 100%);
  border-right:1px solid var(--border);padding:18px 12px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:10px}
.side-brand .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:#fff}
.side-brand .logo svg{width:18px;height:18px}
.side-brand b{font-size:13.5px;display:block;color:#fff}
.side-brand small{color:rgba(255,255,255,.7);font-size:10.5px}
.side-group{font-size:10px;color:rgba(255,255,255,.55);text-transform:uppercase;font-weight:800;letter-spacing:.8px;padding:12px 10px 4px}
button.side-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;color:rgba(255,255,255,.82);border:0;border-radius:9px;
  padding:8px 10px;font-size:13px;font-weight:600;
}
button.side-item span{font-size:14px;width:20px;text-align:center}
.side-ic{display:flex!important;align-items:center;justify-content:center}
.side-ic svg{width:16px;height:16px}
.inicio-ic{display:flex;align-items:center;justify-content:center;color:var(--accent)}
.inicio-ic svg{width:26px;height:26px}
button.side-item:hover{background:rgba(255,255,255,.1);color:#fff}
button.side-item.active{background:rgba(255,255,255,.92);color:#0d3d3d}
.side-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.18);display:flex;flex-direction:column;gap:8px}
.side-footer button{width:100%;font-size:12px}
.side-footer button.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
.side-footer button.ghost:hover{background:rgba(255,255,255,.18)}
.layout main{flex:1;min-width:0}
.hbar-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px}
.hbar-lbl{width:190px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.hbar{flex:1;height:10px;background:var(--bg2);border-radius:99px;overflow:hidden}
.hbar > div{height:100%;background:var(--accent);border-radius:99px}
.timeline{border-left:2px solid var(--border);margin-left:8px;padding-left:18px;display:flex;flex-direction:column;gap:10px}
.tl-item{position:relative;font-size:13px}
.tl-dot{position:absolute;left:-24px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.esteira-board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.esteira-col{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  min-width:270px; max-width:270px; flex-shrink:0; padding:12px; box-shadow:var(--shadow);
}
.esteira-col-head{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.esteira-cards{display:flex;flex-direction:column;gap:8px;min-height:40px}
.esteira-card{
  background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px 12px;
  cursor:pointer; transition:border-color .12s;
}
.esteira-card:hover{border-color:var(--accent)}
.ec-title{font-size:13px;font-weight:700;margin-bottom:4px}
.ec-sub{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.ec-foot{display:flex}
.ec-empty{color:var(--muted2);font-size:12px;text-align:center;padding:14px 0}
.anexo-list{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.anexo-item{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:13px}
.anexo-item a{color:var(--accent);text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anexo-item button{padding:2px 8px}
.esteira-card.urgente{border-left:3px solid var(--err)}
.esteira-card.alta{border-left:3px solid var(--warn)}
.tag.ERRO{background:var(--err-soft);color:var(--err)}
.upload-box{background:var(--bg2);border:1px dashed var(--border);border-radius:12px;padding:14px;margin-top:10px}
.transfer-box{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:14px;margin-top:16px}
.transfer-box label{margin-bottom:4px}
button.esteira-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
